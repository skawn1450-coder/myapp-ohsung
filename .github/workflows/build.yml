name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          export VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))
          ./gradlew :app:assembleRelease --no-daemon

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VC=$((GITHUB_RUN_NUMBER + 100))
          cp app/build/outputs/apk/release/app-release.apk "market-brief-$VC.apk"
          gh release create "build-$VC" "market-brief-$VC.apk" \
            --title "오늘의 시장 build $VC" \
            --notes "자동 빌드 · ${GITHUB_SHA::7}" \
            --latest
